<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyShop — Cart</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="logo display">MyShop</a>
    <nav>
      <a href="/" class="mono">Catalogue</a>
      <a href="/seller-dashboard.html" class="mono seller-only">Sell</a>
      <a href="/cart.html" class="mono">Cart<span class="badge" id="cart-count">0</span></a>
      <span class="guest-only"><a href="/login.html" class="mono">Login</a></span>
      <span class="auth-only mono">
        <span id="user-name"></span>
        <button id="logout-btn">Logout</button>
      </span>
    </nav>
  </div>
</header>

<div class="cart-page">
  <h1 class="display">Your cart</h1>
  <div id="cart-items"></div>
  <div id="cart-summary" class="cart-summary" style="display:none">
    <div class="row"><span>Subtotal</span><span id="cart-subtotal"></span></div>
    <button id="checkout-btn" class="btn btn-primary btn-block">Checkout</button>
    <p id="checkout-msg" class="error-msg" style="display:none"></p>
  </div>
</div>

<footer class="site-footer">MyShop — a full-stack e-commerce demo</footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
