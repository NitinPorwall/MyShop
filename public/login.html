<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyShop — Login</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="logo display">MyShop</a>
    <nav><a href="/" class="mono">Catalogue</a></nav>
  </div>
</header>

<div class="form-page">
  <div class="form-card">
    <h1 class="display">Welcome back</h1>
    <p class="subtitle mono">LOG IN TO YOUR ACCOUNT</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
      <p id="login-error" class="error-msg" style="display:none"></p>
    </form>
    <p class="form-footer">New here? <a href="/register.html" style="text-decoration:underline">Create an account</a></p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
