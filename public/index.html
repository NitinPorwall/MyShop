<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyShop — Catalogue</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="logo display">MyShop</a>
    <nav>
      <a href="/" class="mono">Catalogue</a>
      <a href="/seller-dashboard.html" class="mono seller-only">Sell</a>
      <a href="/cart.html" class="mono">Cart<span class="badge" id="cart-count">0</span></a>
      <span class="guest-only"><a href="/login.html" class="mono">Login</a></span>
      <span class="auth-only mono">
        <span id="user-name"></span>
        <button id="logout-btn">Logout</button>
      </span>
    </nav>
  </div>
</header>

<section class="hero">
  <p class="eyebrow mono">Full catalogue</p>
  <h1 class="display">One marketplace, every category you need.</h1>
  <p>Browse electronics, fashion, home goods, books and more. Sign in as a seller to list your own products.</p>
</section>

<div class="filters" id="filters">
  <button class="pill active" data-category="All">All</button>
  <button class="pill" data-category="Electronics">Electronics</button>
  <button class="pill" data-category="Fashion">Fashion</button>
  <button class="pill" data-category="Home & Kitchen">Home & Kitchen</button>
  <button class="pill" data-category="Beauty & Personal Care">Beauty</button>
  <button class="pill" data-category="Books">Books</button>
  <button class="pill" data-category="Sports & Fitness">Sports & Fitness</button>
  <button class="pill" data-category="Groceries">Groceries</button>
  <span class="spacer"></span>
  <input type="text" id="search-input" placeholder="Search products" />
  <select id="sort-select">
    <option value="">Featured</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>
</div>

<div id="product-grid" class="grid"></div>

<footer class="site-footer">MyShop — a full-stack e-commerce demo</footer>

<script src="/js/api.js"></script>
<script src="/js/catalogue.js"></script>
</body>
</html>
